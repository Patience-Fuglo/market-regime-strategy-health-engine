[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-strategy-health-engine"
version = "0.1.0"
description = "Point-in-time market regime classification and strategy health diagnostics: regime features, strategy performance monitoring, signal health, regime-conditioned diagnostics, and root-cause alerting"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "alpha-validation-toolkit @ git+https://github.com/Patience-Fuglo/alpha-validation-toolkit.git",
    "factor-model-engine @ git+https://github.com/Patience-Fuglo/factor-model-engine.git",
    "portfolio-construction-engine @ git+https://github.com/Patience-Fuglo/portfolio-construction-engine.git",
    "portfolio-risk-engine @ git+https://github.com/Patience-Fuglo/portfolio-risk-engine.git",
    "transaction-cost-engine @ git+https://github.com/Patience-Fuglo/transaction-cost-engine.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real CLI subprocesses or multi-stage pipelines end to end; still run by default, just slower than the rest of the suite",
]
